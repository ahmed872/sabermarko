# Release: push a tag "vX.Y.Z" (matching package.json) to build the Windows installer on a real
# Windows runner, run the tests, compute SHA256 and publish a GitHub Release.
#
# NO private key, password, certificate or other secret is used or uploaded here. The installer is
# NOT code-signed (there is no code-signing certificate); publishing on GitHub does not sign it.
# A manual run (workflow_dispatch) builds the installer as a downloadable artifact without publishing.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # never look for a signing certificate
      # manual (non-tag) builds are never published, so they may use the development license key
      ALLOW_DEV_LICENSE_KEY: ${{ github.ref_type == 'tag' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release gate (version / changelog / production license key / secret scan)
        run: node tools/release/check-release.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build NSIS installer (unsigned)
        run: npx electron-builder --win nsis --publish never
      - name: SHA256 checksum
        shell: pwsh
        run: |
          $f = Get-ChildItem release -Filter 'SaberMarko-POS-Setup-*.exe' | Select-Object -First 1
          if (-not $f) { throw 'installer not found' }
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -Encoding ascii -NoNewline release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - name: Report code-signing status (no certificate -> expected NotSigned)
        shell: pwsh
        run: |
          $f = (Get-ChildItem release -Filter 'SaberMarko-POS-Setup-*.exe' | Select-Object -First 1).FullName
          $s = Get-AuthenticodeSignature $f
          Write-Host "Authenticode status of $(Split-Path $f -Leaf): $($s.Status)"
      - name: Verify the installer on Windows (size, version, install, shortcuts, app launch, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem release -Filter "SaberMarko-POS-Setup-$version.exe" | Select-Object -First 1
          if (-not $setup) { throw "release/SaberMarko-POS-Setup-$version.exe not found (version mismatch?)" }
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "installer: $($setup.Name) $mb MB"
          if ($mb -lt 50 -or $mb -gt 400) { throw "installer size $mb MB is outside the expected 50-400 MB" }

          # silent per-user install
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\SaberMarko POS'
          $exe = Join-Path $dir 'SaberMarko POS.exe'
          foreach ($f in @($exe, (Join-Path $dir 'resources\app.asar'), (Join-Path $dir 'Uninstall SaberMarko POS.exe'))) {
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
          }
          $fileVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "installed exe version: $fileVersion"
          if (-not $fileVersion.StartsWith($version)) { throw "installed exe version $fileVersion != package version $version" }
          # read the target straight from the .lnk bytes (WScript.Shell returns an empty target for the Arabic shortcut name)
          $roots = @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs", [Environment]::GetFolderPath('Desktop'), "$env:PUBLIC\Desktop") | Where-Object { $_ -and (Test-Path $_) }
          $all = @(foreach ($r in $roots) { Get-ChildItem -LiteralPath $r -Filter *.lnk -Recurse -ErrorAction SilentlyContinue })
          $pointsToApp = { param($f) $b = [IO.File]::ReadAllBytes($f); $u = [Text.Encoding]::Unicode
            ($u.GetString($b) + ' ' + $u.GetString($b, 1, $b.Length - 1) + ' ' + [Text.Encoding]::ASCII.GetString($b)) -match 'SaberMarko POS\.exe' }
          $ours = @($all | Where-Object { & $pointsToApp $_.FullName })
          foreach ($l in $ours) { Write-Host "shortcut -> app: $($l.FullName)" }
          $desktop = @($ours | Where-Object { $_.FullName -like "$([Environment]::GetFolderPath('Desktop'))*" })
          $startMenu = @($ours | Where-Object { $_.FullName -like '*\Start Menu\*' })
          if ($desktop.Count -lt 1) { throw 'no Desktop shortcut points to the installed exe' }
          if ($startMenu.Count -lt 1) { throw 'no Start Menu shortcut points to the installed exe' }

          # launch the installed app with a throw-away data folder; it must start, create its database and log, and keep running
          $ud = Join-Path $env:RUNNER_TEMP 'sbm-launch'
          $env:SBM_USER_DATA = $ud
          $app = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          # the logs folder appears a moment after start: only search it once it exists
          $started = { (Test-Path "$ud\logs") -and [bool](Get-ChildItem "$ud\logs" -File | Select-String -Pattern "app started v$version \(win32\)" -Quiet) }
          while ((Get-Date) -lt $deadline -and -not (& $started)) { Start-Sleep -Seconds 2 }
          if (-not (& $started)) { if (Test-Path $ud) { Get-ChildItem -Recurse $ud }; throw 'the installed app did not log a successful start within 60 s' }
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "the installed app exited by itself (code $($app.ExitCode))" }
          if (-not (Test-Path "$ud\data\store.db")) { throw 'the app did not create its database' }
          Get-ChildItem "$ud\logs" -File | Get-Content | Select-Object -First 20
          Get-Process | Where-Object { $_.Path -eq $exe } | Stop-Process -Force
          Start-Sleep -Seconds 3
          Remove-Item Env:SBM_USER_DATA

          # silent uninstall: program removed, store data kept
          Start-Process (Join-Path $dir 'Uninstall SaberMarko POS.exe') -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw 'uninstall left the program behind' }
          if (-not (Test-Path "$ud\data\store.db")) { throw 'uninstall deleted store data' }
          Write-Host "INSTALLER VERIFIED on Windows: size, version $version, files, shortcuts, launch (process alive, DB + log created), uninstall (data kept)."
          Write-Host 'NOT verified here: the UI on a real screen, receipt printing on a real printer.'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/SaberMarko-POS-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: windows-installer
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: out
      - name: Re-verify checksum after transfer
        run: cd out && sha256sum -c SHA256SUMS.txt
      - name: Release notes
        run: |
          if [ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then cp "docs/release-notes/${GITHUB_REF_NAME}.md" notes.md
          else awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0,v)==1{p=1;print;next} /^## \[/{p=0} p' CHANGELOG.md > notes.md; fi
          printf '\n\n**SHA256**\n```\n%s\n```\n' "$(cat out/SHA256SUMS.txt)" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: SaberMarko POS ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
